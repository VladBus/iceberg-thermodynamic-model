# ==============================================================================
# GitHub Actions CI for AARI Iceberg Thermodynamic & Dynamics Model
# Runs all Fortran tests via fpm auto-discovery (64 Fortran source files; 59 FPM test targets; count as of 2026-10-20)
# Requires: -I/usr/include for netcdf.mod (system package libnetcdff-dev)
# ==============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Fortran Tests (fpm)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libnetcdff-dev libnetcdf-dev

      - name: Install fpm (Fortran Package Manager)
        run: |
          FPM_VERSION="0.13.0"
          curl -fsSL "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/fpm-${FPM_VERSION}-linux-x86_64-gcc-12" \
            -o /tmp/fpm
          chmod +x /tmp/fpm
          sudo mv /tmp/fpm /usr/local/bin/fpm
          fpm --version

      - name: Build and run all tests
        run: |
          fpm test --flag "-I/usr/include -Wno-error=line-truncation -ffree-line-length-none" -v

      - name: Run T2 ocean-core diagnostics explicitly (named targets, both EOS modes)
        run: |
          FLAGS="-I/usr/include -Wno-error=line-truncation -ffree-line-length-none"
          # Named-target gates (fail genuinely: nonzero exit on invariant violation).
          # NOTE: fpm prints "No tests to run" + exit 0 for a WRONG target name,
          # so the driver below is the authoritative re-run and freshness check.
          fpm test --flag "$FLAGS" --target test_homogeneous_column
          EOS_MODE=EOS80 fpm test --flag "$FLAGS" --target test_homogeneous_column
          fpm test --flag "$FLAGS" --target test_weak_inversion
          EOS_MODE=EOS80 fpm test --flag "$FLAGS" --target test_weak_inversion
          fpm test --flag "$FLAGS" --target test_weak_inversion_conservation
          EOS_MODE=EOS80 fpm test --flag "$FLAGS" --target test_weak_inversion_conservation
          fpm test --flag "$FLAGS" --target test_ca_compressibility
          EOS_MODE=EOS80 fpm test --flag "$FLAGS" --target test_ca_compressibility

      - name: Run T2 diagnostic drivers (parse Fortran JSON, propagate failures)
        run: |
          python3 python/tests/ocean/test_homogeneous_column.py
          python3 python/tests/ocean/test_weak_inversion.py
          python3 python/tests/ocean/test_weak_inversion_conservation.py
          python3 python/tests/ocean/test_ca_compressibility.py

      - name: Run T1 ERA5 interpolation harness (production reader, synthetic data)
        run: |
          FLAGS="-I/usr/include -Wno-error=line-truncation -ffree-line-length-none"
          fpm test --flag "$FLAGS" --target test_era5_interp_harness
          python3 python/tests/ocean/test_era5_spatial_interpolation.py
          python3 python/tests/ocean/test_era5_temporal_interpolation.py
          python3 python/tests/ocean/test_era5_longitude_wrap.py

  test-python:
    name: Python Environment Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: iceberg-thermodynamic-model
          environment-file: environment.yml
          auto-activate-base: false

      - name: Verify Python imports
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python -c "import xarray, netCDF4, numpy, pandas, matplotlib, scipy, pyproj, rasterio; print('All core packages imported successfully')"

      - name: Check key analysis scripts exist
        run: |
          test -f python/analysis/run_manifest.py && echo "run_manifest.py OK"
          test -f python/analysis/units.py && echo "units.py OK"
          test -f python/analysis/run_context.py && echo "run_context.py OK"
          test -f python/era5/download_era5.py && echo "download_era5.py OK"
          test -f python/grid/build_real_grid_inputs.py && echo "build_real_grid_inputs.py OK"
          test -f python/ice/build_initial_ice.py && echo "build_initial_ice.py OK"

      - name: Run Stage 10.8.1 Python basal melt validation
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_basal_melt_validation.py

      - name: Run Stage 10.8.2 Python observational validation
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_observational_validation.py

      - name: Run Stage 10.9 Python calibration assessment
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_calibration_assessment.py

      - name: Run Stage 10.10/10.10.1 Python three-equation validation
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_three_equation.py

      - name: Run Stage 10.11 Python natural convection validation
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_three_equation_natural.py

      - name: Run Stage 10.12 Python internal thermal evolution validation
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_internal_thermal_evolution.py

      - name: Run Stage 11.7E.2 EN4 contract verification
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_stage11_7e2_en4_contract.py

      - name: Run Stage 11.7E.2.3 Provenance attributes verification
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_provenance_attributes.py

      - name: Enforce ERA5 fixture presence
        shell: bash -l {0}
        run: |
          test -f python/tests/fixtures/era5_synthetic.nc || {
            echo "FAIL: fixture missing from repository"; exit 1; }

      - name: Run Stage 11.7E.3 ERA5 contract verification
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/test_stage11_7e3_era5_contract.py

      - name: Run snowfall-period source-metadata check
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_snowfall_period.py

      - name: Run T0 EN4 initial verification (explicit SKIP without data)
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_en4_initial_verification.py

      - name: Run T0 ERA5 coverage verification (explicit SKIP without data)
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_era5_coverage_verification.py

      - name: Run T1 wind-rotation verification (explicit SKIP without data)
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_wind_rotation.py

      - name: Run ice-coverage diagnostic (explicit SKIP without data bundle)
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_ice_coverage.py

      - name: Run sea-ice provenance diagnostic (explicit SKIP without binary/data)
        shell: bash -l {0}
        run: |
          conda activate iceberg-thermodynamic-model
          python python/tests/ocean/test_seaice_provenance.py
